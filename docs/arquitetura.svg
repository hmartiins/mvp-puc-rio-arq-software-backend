<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Gerador de Cardapio Semanal — Cenario 1.1</text>

  <rect x="30" y="90" width="200" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="130" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">Front-End</text>
  <text x="130" y="143" text-anchor="middle" font-size="12" fill="#4338ca">Vite + React + TS</text>
  <text x="130" y="161" text-anchor="middle" font-size="11" fill="#6b7280">navegador / Nginx</text>

  <rect x="350" y="90" width="200" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">API Back-End</text>
  <text x="450" y="143" text-anchor="middle" font-size="12" fill="#047857">Java 21 + Spring Boot 3</text>
  <text x="450" y="161" text-anchor="middle" font-size="11" fill="#6b7280">porta 8080</text>

  <rect x="670" y="90" width="200" height="90" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="770" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">TheMealDB</text>
  <text x="770" y="143" text-anchor="middle" font-size="12" fill="#b45309">API externa gratuita</text>
  <text x="770" y="161" text-anchor="middle" font-size="11" fill="#6b7280">search.php / lookup.php</text>

  <rect x="350" y="240" width="200" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="450" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">PostgreSQL</text>
  <text x="450" y="290" text-anchor="middle" font-size="11" fill="#6b7280">menu_item / shopping_list_check</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <line x1="230" y1="135" x2="342" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="286" y="126" text-anchor="middle" font-size="11" fill="#475569">REST / JSON</text>

  <line x1="550" y1="135" x2="662" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="606" y="126" text-anchor="middle" font-size="11" fill="#475569">HTTPS</text>

  <line x1="450" y1="180" x2="450" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="212" font-size="11" fill="#475569">JPA</text>

  <text x="450" y="205" text-anchor="middle" font-size="0" fill="none">.</text>
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#6b7280">O Front nunca fala com a TheMealDB: toda chamada externa passa pela API.</text>
</svg>
