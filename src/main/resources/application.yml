spring:
  application:
    name: cardapio-semanal-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cardapio}
    username: ${DB_USER:cardapio}
    password: ${DB_PASSWORD:cardapio}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

themealdb:
  base-url: ${THEMEALDB_BASE_URL:https://www.themealdb.com/api/json/v1/1}
  timeout-seconds: ${THEMEALDB_TIMEOUT_SECONDS:5}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
